name: Binary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          mkdir -p out
          hash=$(git rev-parse HEAD)
          short=${hash:0:9}
          export TS_VERSION_LONG="0.0.0-t${short}"
          export TS_VERSION_GIT_HASH="$hash"
          ext=""
          if [ "$GOOS" = "windows" ]; then
            ext=".exe"
          fi
          ./build_dist.sh --box -o "out/inferscale-${GOOS}-${GOARCH}${ext}" ./cmd/tailscaled
          cp "out/inferscale-${GOOS}-${GOARCH}${ext}" "out/inferscaled-${GOOS}-${GOARCH}${ext}"
          if [ "$GOOS" = "windows" ]; then
            curl -fsSL -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
            echo "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51  wintun.zip" | sha256sum -c
            unzip -p wintun.zip wintun/bin/amd64/wintun.dll > out/wintun.dll
            zip -j "out/inferscale-windows-amd64.zip" \
              "out/inferscale-windows-amd64.exe" \
              "out/inferscaled-windows-amd64.exe" \
              out/wintun.dll
            rm -f out/inferscale-windows-amd64.exe out/inferscaled-windows-amd64.exe out/wintun.dll wintun.zip
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: inferscale-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/*
          if-no-files-found: error

  publish:
    # Every push to main publishes the binaries twice: to edge, overwritten
    # each time as before, and to a release of its own, v0.0.<run number>,
    # never overwritten, with a SHA256SUMS file. Clients pin the versioned
    # release and the checksums (inferoute-client plan item S1).
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -eu
          cd dist
          sha256sum inferscale-* inferscaled-* > SHA256SUMS
          cat SHA256SUMS

      - id: version
        run: echo "version=v0.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish the versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          # A version is never reused or overwritten: no --clobber, and an
          # existing release of this name stops the job.
          gh release create "$VERSION" dist/inferscale-* dist/inferscaled-* dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "Inferscale $VERSION" --latest=false \
            --notes "Built from $GITHUB_SHA by $RUN_URL"

      - name: Publish edge release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          find dist -type f -print
          gh release view edge >/dev/null 2>&1 || gh release create edge --notes "edge" --latest=false
          gh release upload edge dist/inferscale-* dist/inferscaled-* --clobber

  pin:
    # Opens a pull request in inferoute-client that pins this release. The
    # app's token can push a branch and open a pull request there and nothing
    # else; only a maintainer merges it.
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CLIENT_PIN_APP_ID }}
          private-key: ${{ secrets.CLIENT_PIN_APP_PRIVATE_KEY }}
          owner: Inferoute
          repositories: inferoute-client
          permission-contents: write
          permission-pull-requests: write

      - name: Fetch the checksums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: gh release download "$VERSION" -p SHA256SUMS -R "$GITHUB_REPOSITORY"

      - uses: actions/checkout@v4
        with:
          repository: Inferoute/inferoute-client
          ref: main
          token: ${{ steps.app.outputs.token }}
          path: client

      - name: Write the pin and open the pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.publish.outputs.version }}
          SLUG: ${{ steps.app.outputs.app-slug }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.publish.outputs.version }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          jq -n --arg v "$VERSION" --arg c "$GITHUB_SHA" --rawfile sums SHA256SUMS \
            '{version: $v, commit: $c, sha256: ($sums | split("\n") | map(select(length > 0) | split("  ") | {(.[1]): .[0]}) | add)}' \
            > client/pkg/inferscale/release.json
          {
            echo "Pins Inferscale $VERSION in the client."
            echo
            echo "- Release: $RELEASE_URL"
            echo "- Source commit: $COMMIT_URL"
            echo "- Built and published by: $RUN_URL"
            echo "- Platforms: Linux amd64 and arm64, macOS amd64 and arm64, Windows amd64 (zip)"
            echo
            echo "Checksums:"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
            echo
            echo "Opened by the Inferscale release workflow. Review it against the release above and merge only if you expected it. The Inferscale pin check compares every file with the release."
          } > body.md
          cd client
          branch="inferscale-pin/$VERSION"
          git config user.name "$SLUG[bot]"
          git config user.email "$SLUG[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add pkg/inferscale/release.json
          git commit -m "Pin Inferscale $VERSION"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Pin Inferscale $VERSION" --body-file ../body.md
